name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.target }} (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        module: ['.', workflow]
        target: [test-unit, test-race, test-published, vet, lint]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache: false
      - name: Install golangci-lint
        if: matrix.target == 'lint'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          install-only: true
      - name: Run Make target
        run: make '${{ matrix.target }}' MODULES='${{ matrix.module }}'
